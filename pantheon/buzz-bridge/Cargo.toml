[package]
name = "buzz-bridge"
version = "0.1.0"
edition = "2021"
description = "Key-safe local Buzz sidecar for Pantheon Desktop"
publish = false

[dependencies]
base64 = "0.22"
hex = "0.4"
keyring = { version = "3", default-features = false, features = ["linux-native", "windows-native"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
secp256k1 = { version = "0.31", features = ["global-context", "hashes", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["io-std", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
